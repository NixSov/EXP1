plugins {
    id "com.android.application"
}

android {
    namespace "com.nixsov.mctogether"
    compileSdk 34

    defaultConfig {
        applicationId "com.nixsov.mctogether"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // Ключ подписи и пароли хранятся локально в keystore.properties (в git не попадают):
    //   storeFile=../keystore/mctogether.jks
    //   storePassword=...
    //   keyAlias=...
    //   keyPassword=...
    // Без этого файла релиз подписывается отладочным ключом.
    def keystorePropsFile = rootProject.file("keystore.properties")
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile file(props["storeFile"])
                storePassword props["storePassword"]
                keyAlias props["keyAlias"]
                keyPassword props["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
