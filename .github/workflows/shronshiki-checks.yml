name: Shronshiki checks
on:
  pull_request:
    paths: ['Shronshiki/**', '.github/workflows/shronshiki-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shronshiki
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /EXP1/ --no-web-resources-cdn
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix test/sql
      - run: npm test --prefix test/sql
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Shronshiki
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Shronshiki-Windows-preview
          path: Shronshiki/build/windows/x64/runner/Release/
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Shronshiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Shronshiki-Android-preview
          path: Shronshiki/build/app/outputs/flutter-apk/app-release.apk
