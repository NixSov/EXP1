# Сборка Shronshiki для Windows: программа (ZIP) и установщик (Inno Setup).
# Результат — артефакт «Shronshiki-Windows» на странице запуска в Actions.
#
# Ключи встраиваются из секретов репозитория (Settings → Secrets and variables →
# Actions), если они заданы: SHRONSHIKI_SUPABASE_URL, SHRONSHIKI_SUPABASE_ANON_KEY,
# SHRONSHIKI_PROXY_URL, SHRONSHIKI_TURN_URLS, SHRONSHIKI_TURN_USERNAME,
# SHRONSHIKI_TURN_CREDENTIAL. Без них программа спросит адрес и ключ при первом запуске.
name: Shronshiki Windows

on:
  push:
    branches: [claude/shronshiki-voice-chat-7xg4o3]
    paths:
      - 'Shronshiki/**'
      - '.github/workflows/shronshiki-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shronshiki-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Shronshiki
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Tests
        run: flutter test

      - name: Config from secrets
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SHRONSHIKI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SHRONSHIKI_SUPABASE_ANON_KEY }}
          PROXY_URL: ${{ secrets.SHRONSHIKI_PROXY_URL }}
          TURN_URLS: ${{ secrets.SHRONSHIKI_TURN_URLS }}
          TURN_USERNAME: ${{ secrets.SHRONSHIKI_TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.SHRONSHIKI_TURN_CREDENTIAL }}
        run: |
          $config = [ordered]@{
            SUPABASE_URL      = "$env:SUPABASE_URL"
            SUPABASE_ANON_KEY = "$env:SUPABASE_ANON_KEY"
            PROXY_URL         = "$env:PROXY_URL"
            TURN_URLS         = "$env:TURN_URLS"
            TURN_USERNAME     = "$env:TURN_USERNAME"
            TURN_CREDENTIAL   = "$env:TURN_CREDENTIAL"
          }
          New-Item -ItemType Directory -Force config | Out-Null
          $config | ConvertTo-Json | Set-Content -Encoding utf8NoBOM config/app_config.json
          if ($env:SUPABASE_URL) { "Supabase: из секретов" } else { "Supabase: не задан — программа спросит при запуске" }

      - name: Build
        run: flutter build windows --release --dart-define-from-file=config/app_config.json

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $env:APP_VERSION = $version
          & $iscc windows\installer\shronshiki.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\installer\Shronshiki-Windows-portable.zip
          Get-ChildItem build\installer

      - uses: actions/upload-artifact@v4
        with:
          name: Shronshiki-Windows
          path: |
            Shronshiki/build/installer/Shronshiki-Setup.exe
            Shronshiki/build/installer/Shronshiki-Windows-portable.zip
          retention-days: 30
